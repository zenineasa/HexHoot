# L5: build the app as users get it and smoke-test the build on every OS
# (test/packaged). Runs on release tags, and by hand from the Actions tab.

name: Packaged app

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Smoke tests against the build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run --auto-servernum npm run test:packaged
          else
            npm run test:packaged
          fi
