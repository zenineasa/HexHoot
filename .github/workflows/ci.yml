name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint

  test:
    runs-on: ${{ matrix.os }}
    # The whole suite takes about 10 minutes; a hang should not hold a
    # runner for GitHub's default of 6 hours
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # One Node version: the newest LTS. (The app itself runs on Electron's
      # own Node; this one runs npm and the test runner.)
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:capability
      - run: npm run test:crypto
      - run: npm run test:protocol
      - run: npm run test:core
      - name: E2E tests (Electron)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run --auto-servernum npm run test:e2e
          else
            npm run test:e2e
          fi
      - name: Upload E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 14
